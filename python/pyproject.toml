[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvou"
version = "0.1.0"
description = "Jump-filtering estimation of time-varying Ornstein-Uhlenbeck processes"
authors = [{ name = "Yuan Li" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=1.4", "scipy>=1.9"]

[tool.setuptools]
packages = ["tvou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
